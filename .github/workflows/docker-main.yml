name: Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag, e.g. v2.03'
        required: true

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || (github.event_name == 'pull_request' && format('pr-{0}', github.event.number)) || github.ref_name }}
      IMAGE: ikmb/eagleimp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/checkout@v4
        with:
          path: .docker
          sparse-checkout: Dockerfile
          sparse-checkout-cone-mode: false

      - name: Build
        run: docker build -f .docker/Dockerfile -t "$IMAGE:$TAG" -t "$IMAGE:latest" .

      - name: Smoke test with the repository example
        run: |
          docker run --rm -v "$PWD/example:/data" "$IMAGE:$TAG" sh -c '
            eagleimp --ref 22.example.ref.vcf.gz --makeQref &&
            eagleimp --geneticMap genetic_map_hg19_chr22.txt --ref 22.example.ref.qref --target 22.example.vcf.gz &&
            test -s 22.example.imputed.vcf.gz'

      - name: Push nach Docker Hub
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker push --all-tags "$IMAGE"
